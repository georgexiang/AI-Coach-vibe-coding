name: PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Classify changed files
        shell: bash
        run: |
          app=false
          infra=false
          workflow=false

          while IFS= read -r file; do
            case "$file" in
              backend/*|frontend/*|backend/Dockerfile|frontend/Dockerfile|docker-compose.yml)
                app=true
                ;;
              infra/*)
                infra=true
                ;;
              .github/workflows/*)
                workflow=true
                ;;
            esac
          done < <(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")

          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"

  backend-test:
    name: Backend lint and tests
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Unit tests
        run: |
          pytest tests/ -v \
            --junitxml=test-results/junit.xml \
            --html=test-results/report.html \
            --self-contained-html \
            --cov=app \
            --cov-report=html:test-results/coverage \
            --cov-report=xml:test-results/coverage.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results/

  frontend-test:
    name: Frontend typecheck and build
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Build
        run: npm run build

  docker-build:
    name: Docker build validation
    needs: [changes, backend-test, frontend-test]
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image without pushing
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: ai-coach-backend:pr-${{ github.event.pull_request.number }}

      - name: Build frontend image without pushing
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: ai-coach-frontend:pr-${{ github.event.pull_request.number }}

  infra-validation:
    name: Infra validation
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $files = @(
            "infra/azure/scripts/deploy.ps1",
            "infra/azure/scripts/build-and-push.ps1",
            "infra/azure/scripts/set-github-vars.ps1",
            "infra/azure/scripts/test-region-availability.ps1",
            "infra/azure/scripts/verify-deployment.ps1"
          )
          foreach ($file in $files) {
            [scriptblock]::Create((Get-Content -Path $file -Raw)) > $null
          }
      - name: Bicep build
        run: az bicep build --file infra/azure/main.bicep

  pr-ci-result:
    name: PR CI result
    needs: [changes, backend-test, frontend-test, docker-build, infra-validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs for changed areas
        shell: bash
        run: |
          app="${{ needs.changes.outputs.app }}"
          infra="${{ needs.changes.outputs.infra }}"
          workflow="${{ needs.changes.outputs.workflow }}"

          if [[ "$app" == "true" || "$workflow" == "true" ]]; then
            if [[ "${{ needs.backend-test.result }}" != "success" ||
                  "${{ needs.frontend-test.result }}" != "success" ||
                  "${{ needs.docker-build.result }}" != "success" ]]; then
              echo "::error::App CI failed or did not complete."
              exit 1
            fi
          fi

          if [[ "$infra" == "true" || "$workflow" == "true" ]]; then
            if [[ "${{ needs.infra-validation.result }}" != "success" ]]; then
              echo "::error::Infra validation failed or did not complete."
              exit 1
            fi
          fi

          echo "Required PR checks passed for changed areas."
